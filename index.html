<!DOCTYPE html>
<html>

<head>
    <title>Suncire Player (Simple)</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        if (videoId) {
            // URL "Embed" definitiva com todos os hacks de desbloqueio
            // Adicionamos 'origin' apontando para o próprio github pages pra enganar o youtube
            const finalUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&controls=0&disablekb=1&fs=0&rel=0&modestbranding=1&loop=1&playlist=${videoId}&origin=${window.location.origin}`;

            document.getElementById('container').innerHTML = `<iframe src="${finalUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        } else {
            document.body.innerHTML = "<h1 style='color:white;text-align:center;font-family:sans-serif;margin-top:20%'>Suncire: Sem Vídeo ID</h1>";
        }
    </script>
</body>

</html>
