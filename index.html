<!DOCTYPE html>
<html>

<head>
    <title>Suncire Player</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div id="player"></div>

    <script>
        // Pega o ID do video da URL (ex: index.html?v=XqZsoesa55w)
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const volume = urlParams.get('vol') || 100;

        if (videoId) {
            // Carrega API do YouTube
            var tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            var firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            var player;
            function onYouTubeIframeAPIReady() {
                player = new YT.Player('player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    playerVars: {
                        'autoplay': 1,
                        'controls': 0,     // Sem botões
                        'disablekb': 1,    // Sem teclado
                        'fs': 0,           // Sem botão fullscreen
                        'loop': 1,         // Loop infinito
                        'modestbranding': 1,
                        'rel': 0,          // Sem videos relacionados
                        'playlist': videoId, // Necessário para o loop funcionar
                        'iv_load_policy': 3 // Sem anotações
                    },
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }

            function onPlayerReady(event) {
                event.target.setVolume(volume);
                event.target.playVideo();
            }

            function onPlayerStateChange(event) {
                // Se o vídeo acabar (state 0), toca de novo (garantia extra de loop)
                if (event.data === YT.PlayerState.ENDED) {
                    player.playVideo();
                }
            }
        } else {
            console.error("Nenhum Video ID fornecido (?v=ID)");
            document.body.innerHTML = "<h1 style='color:white; text-align:center; font-family:sans-serif;'>Suncire Player: Aguardando Vídeo...</h1>";
        }
    </script>
</body>

</html>
