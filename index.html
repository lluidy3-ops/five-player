<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
        }

        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="player"></div>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const url = params.get('url');
        let ytPlayer = null;
        let currentVolume = 100;

        function getYouTubeID(url) {
            if (url.includes('v=')) return url.split('v=')[1].split('&')[0];
            if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split('?')[0];
            return null;
        }

        function onYouTubeIframeAPIReady() {
            const videoId = getYouTubeID(url);
            if (!videoId) {
                document.body.innerHTML = '<h1 style="color:white">Invalid YouTube URL</h1>';
                return;
            }

            ytPlayer = new YT.Player('player', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    loop: 1,
                    playlist: videoId,
                    mute: 0,
                    modestbranding: 1,
                    rel: 0
                },
                events: {
                    onReady: (event) => {
                        event.target.setVolume(currentVolume);
                        event.target.playVideo();
                    }
                }
            });
        }

        // Atualizar volume quando hash mudar
        window.addEventListener('hashchange', () => {
            const newVol = parseInt(window.location.hash.replace('#vol=', '')) || 100;
            currentVolume = newVol;
            if (ytPlayer && ytPlayer.setVolume) {
                ytPlayer.setVolume(newVol);
                console.log('[SUNCIRE PLAYER] Volume atualizado:', newVol);
            }
        });

        // Aplicar volume inicial
        const initialVol = parseInt(window.location.hash.replace('#vol=', '')) || 100;
        currentVolume = initialVol;
        console.log('[SUNCIRE PLAYER] Volume inicial:', initialVol);
    </script>
</body>

</html>
